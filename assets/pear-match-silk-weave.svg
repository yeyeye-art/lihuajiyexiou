 <linearGradient id="warp" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ae9b7a" stop-opacity=".13"/><stop offset=".28" stop-color="#fff" stop-opacity=".7"/><stop offset=".6" stop-color="#af9e80" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity=".22"/></linearGradient>
 <linearGradient id="weft" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#aa9c7d" stop-opacity=".14"/><stop offset=".48" stop-color="#fffdf2" stop-opacity=".8"/><stop offset="1" stop-color="#bcaa89" stop-opacity=".17"/></linearGradient>
